[package]
name = "content-factory-desktop"
version = "0.1.30"
description = "爆款内容工厂 Windows 桌面端"
authors = ["Content Factory Team"]
edition = "2021"

[lib]
name = "content_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
